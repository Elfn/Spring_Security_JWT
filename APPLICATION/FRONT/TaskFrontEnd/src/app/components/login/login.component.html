<div class="container">
  
    <div class="alert alert-danger" *ngIf="mode==1" >
        <strong>Bad credentials!</strong> invalid username or password
    </div>
    <div class="col-md-6 col-md-offset-3">

        <div class="panel panel-primary">
            <div class="panel-heading">Authentication</div>
                <div class="panel-body">
                    <form   #f="ngForm" (ngSubmit)="onLogin(f.value)">
                        <div class="form-group">
                            <label class="control-label">Login :</label>
                            <input ngModel="" class="form-control" type="text" name="username" placeholder="Your username..." required/>
                        </div>
                        <div class="form-group">
                            <label class="control-label">Password :</label>
                            <input  ngModel="" class="form-control" type="password" name="password" placeholder="Your password ..." required/>
                        </div>
                        
                            <!-- <input class="btn btn-primary" type="submit" value="Login"/> -->
                            <button type="submit" class="btn btn-danger">Login</button>
                            <button type="submit" class="btn btn-success">Register</button>
                            
                        
                    </form>
                </div>
            </div>

    </div>
      
</div>
